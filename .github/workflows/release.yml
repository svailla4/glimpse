# Publishes an installable plugin after every merge into main, and when a version tag is pushed by hand.
#
# Claude Code never builds a plugin on install: the files it copies must already contain plugin/dist. main keeps build
# output out of git, so this workflow builds the commit, sets the plugin's version and pushes the result to the
# `release` branch. The marketplace entry on main points there (git-subdir, path plugin, ref release), so
#   claude plugin marketplace add svailla4/glimpse
#   claude plugin install glimpse@glimpse
# installs a ready-to-run plugin, and `claude plugin update glimpse@glimpse` picks up the next version.
#
# A push to main is released as the next patch version: the tag is pushed only after check, tests and build pass, so
# a broken main gets no tag. A minor or major version is a tag pushed by hand (git tag v0.2.0 && git push origin
# v0.2.0). Tags this workflow pushes with GITHUB_TOKEN start no other run, so each version is built once.
name: release

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

# Runs one at a time, so the next patch is counted from the tag the previous run pushed. A run waiting here is
# replaced by a newer one; the newer commit contains it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Choose the version
        id: next
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --force --tags origin
          if git tag --points-at HEAD | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "$(git tag --points-at HEAD) already names this commit; its own run publishes it"
            exit 0
          fi
          LATEST="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          LATEST="${LATEST:-v0.0.0}"
          IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
          VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "after $LATEST: v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    if: needs.version.outputs.version != ''
    # macOS is the platform Glimpse is verified on, and the gate in ci.yml.
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NEW_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      # .npmrc sets ignore-scripts=true: no dependency runs code at install time.
      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: npm run check

      - name: Unit and component tests
        run: npm test

      - name: Build the plugin (viewer, server bundle, skill, third-party notices)
        run: npm run build

      - name: Set the plugin version from the tag
        run: |
          node -e '
            const fs = require("node:fs");
            const file = "plugin/.claude-plugin/plugin.json";
            const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
            manifest.version = process.argv[1];
            fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + "\n");
          ' "$VERSION"
          grep -n '"version"' plugin/.claude-plugin/plugin.json

      - name: The built plugin is complete
        run: |
          test -s plugin/dist/server.mjs
          test -s plugin/dist/viewer/index.html
          test -s plugin/dist/THIRD_PARTY_NOTICES.md
          test -s plugin/skills/glimpse/SKILL.md
          test -s plugin/LICENSE.md

      - name: Tag the merge with the next patch version
        if: env.NEW_TAG != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "Glimpse $VERSION" "$GITHUB_SHA"
          git push origin "$NEW_TAG"

      - name: Push the built plugin to the release branch
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/release"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin release >/dev/null; then
            git fetch --no-tags origin release
            git worktree add --detach "$OUT" FETCH_HEAD
            git -C "$OUT" checkout -B release
          else
            git worktree add --detach "$OUT"
            git -C "$OUT" checkout --orphan release
            git -C "$OUT" rm -rfq .
          fi

          # The branch holds only what an install needs: the plugin (dist included) and the licence files.
          find "$OUT" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R plugin "$OUT/plugin"
          cp LICENSE.md NOTICE.md THIRD_PARTY_NOTICES.md "$OUT/"
          cat > "$OUT/README.md" <<EOF
          # Glimpse $VERSION (release build)

          This branch is written by the release workflow and holds the built Claude Code plugin. Do not edit it.
          Source, documentation and issues: https://github.com/${GITHUB_REPOSITORY}

          Install:

              claude plugin marketplace add ${GITHUB_REPOSITORY}
              claude plugin install glimpse@glimpse

          Licence: Functional Source License 1.1, ALv2 Future License (FSL-1.1-ALv2, LICENSE.md): any purpose
          other than a Competing Use as the licence defines it, and Apache License 2.0 two years after this
          version is made available. Release v0.1.0 and earlier remain under PolyForm Noncommercial 1.0.0.
          Third-party components keep their own licences: THIRD_PARTY_NOTICES.md and NOTICE.md.
          EOF

          git -C "$OUT" add -A -f
          if git -C "$OUT" diff --cached --quiet; then
            echo "release branch already matches this build"
            exit 0
          fi
          git -C "$OUT" commit -q -m "Release v$VERSION (built from ${GITHUB_SHA::7})"
          git -C "$OUT" push origin release
